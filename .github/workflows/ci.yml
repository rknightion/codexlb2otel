# CI runs the toolchain-only gate plus the two heavyweight release checks. The
# justfile owns GOEXPERIMENT and the pinned Go task-surface tools, so every
# executable validation below goes through a documented `just` recipe.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build, lint, test, probe
    runs-on: ubuntu-latest
    # Non-corpus tests are fast (seconds to low minutes); this ceiling is a
    # safety net against a hang, not a measurement of expected runtime. The
    # full corpus suite never runs here: test-short explicitly opts out because
    # archives are personal data and never committed.
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor artipacked: later steps and uploaded artifacts must not read
          # checkout credentials from .git/config.
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: just check
        run: just check < /dev/null

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: just lint
        run: just lint < /dev/null

  # Dependency vulnerability scan against the Go vulnerability database. Its
  # pin and installation live in justfile, so local and CI use the same tool.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: just vuln
        run: just vuln < /dev/null

  # Cross-compilation is deliberately outside `just check`: it is a CI-only
  # release-artifact validation, not a pre-commit dependency.
  goreleaser-snapshot:
    name: goreleaser build (snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Snapshot creates release-shaped artifacts; do not restore an
          # attacker-influenced cache before it runs on pull requests.
          cache: false

      - name: setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: setup goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.16.0"
          # Install the binary only; `just snapshot` below runs it. Without
          # this the action demands an `args:` input and fails the step.
          install-only: true

      - name: just snapshot
        run: just snapshot < /dev/null

  # The runtime image needs a Docker daemon, so it is in CI's heavy leg rather
  # than the portable `just check` pre-commit gate.
  docker-build:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: just image
        run: just image codexlb2otel:ci < /dev/null

  # Single aggregator the branch ruleset gates. Keeping the ruleset pinned to one
  # check means jobs can change without a branch-protection edit.
  ci-success:
    name: ci-success
    runs-on: ubuntu-24.04
    if: always()
    needs: [build-test, lint, govulncheck, goreleaser-snapshot, docker-build]
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required job failed or was cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All required jobs passed
        run: echo "ci-success — ${{ join(needs.*.result, ', ') }}"
