   The three templates already reference --bg/--panel/--line/... in hundreds of
   places, including inside JS that writes `fill:"var(--rx)"` into SVG. Keeping
   these aliases means the restyle lands as a palette swap plus targeted
   per-page edits, not a rename sweep. New CSS should use the --t2o-* names.
   ───────────────────────────────────────────────────────────────────────── */

  --bg:var(--t2o-bg);
  --panel:var(--t2o-surface);
  --panel2:var(--t2o-raised);
  --line:var(--t2o-line);
  --fg:var(--t2o-fg);
  --muted:var(--t2o-fg-muted);
  --accent:var(--t2o-accent);
  --ok:var(--t2o-ok);
  --warn:var(--t2o-warn);
  --err:var(--t2o-fail);
  --pending:var(--t2o-fg-muted);
  --grid:var(--t2o-line);
  --tx:var(--t2o-tx);
  --rx:var(--t2o-rx);
  --mono:var(--t2o-mono);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--t2o-bg);color:var(--t2o-fg);
  font-family:var(--t2o-sans);font-size:var(--t2o-fs-sm);line-height:1.45;
}
a{color:var(--t2o-accent);text-decoration:none}
a:hover{color:var(--t2o-accent-hover);text-decoration:underline}
header{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:var(--t2o-surface);
  border-bottom:1px solid var(--t2o-line);
  position:sticky;top:0;z-index:5;
}
h1{margin:0;font-size:14px;font-weight:var(--t2o-fw-semibold);letter-spacing:-0.01em;
  display:inline-flex;align-items:center;gap:7px}
#dot{display:inline-flex;align-items:center;color:var(--t2o-fg-muted)}
.meta{color:var(--t2o-fg-muted);font-family:var(--t2o-mono);font-size:var(--t2o-fs-xs)}
.meta.warn{color:var(--t2o-warn)}
.conn{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;
  border:1px solid currentColor;border-radius:var(--t2o-radius-control);
  font-size:var(--t2o-fs-2xs);font-weight:var(--t2o-fw-semibold);
  letter-spacing:.06em;text-transform:uppercase}
.conn.up{color:var(--t2o-ok)}
.conn.retry{color:var(--t2o-fail)}
.conn.wait{color:var(--t2o-fg-muted)}
#theme{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--t2o-line-strong);
  border-radius:var(--t2o-radius-control);color:var(--t2o-fg-soft);
  font-family:var(--t2o-sans);font-size:12px;padding:3px 9px;cursor:pointer;
}
#theme:hover{color:var(--t2o-fg);border-color:var(--t2o-accent)}
main{
  padding:6px 0 48px;
  display:grid;grid-template-columns:1fr auto auto;
  column-gap:22px;align-items:baseline;
}
.row{display:contents;cursor:pointer}
.cell{padding:3px 0}
.cell:first-child{padding-left:16px}
.cell:last-child{padding-right:16px}
.row:hover>.cell{background:var(--t2o-raised)}
.row.open>.cell{background:var(--t2o-raised)}
.row.target>.cell{background:var(--t2o-raised);box-shadow:inset 2px 0 0 var(--t2o-accent)}
.row.arrived>.cell{box-shadow:inset 2px 0 0 var(--t2o-accent);animation:arrive 240ms ease-out}
.under{grid-column:1 / -1}
.lead{display:flex;align-items:baseline;gap:6px;min-width:0}
.tree{font-family:var(--t2o-mono);font-size:var(--t2o-fs-sm);
  color:var(--t2o-fg-muted);white-space:pre;flex:none}
.caret{font-family:var(--t2o-mono);font-size:var(--t2o-fs-sm);
  color:var(--t2o-fg-muted);width:1.2ch;text-align:center;flex:none}
.caret.has{cursor:pointer}
.caret.has:hover{color:var(--t2o-fg)}
.nm{font-family:var(--t2o-mono);font-size:var(--t2o-fs-sm);
  font-weight:var(--t2o-fw-semibold);color:var(--t2o-fg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:4px;flex:none;
  padding:0 5px;border:1px solid var(--t2o-line-strong);
  border-radius:var(--t2o-radius-control);
  font-size:var(--t2o-fs-2xs);letter-spacing:.06em;text-transform:uppercase;
  color:var(--t2o-fg-muted)}
.tag.sub{color:var(--t2o-fg-muted)}
.tag.fork{color:var(--t2o-fg-soft)}
.tag.err{border-color:var(--t2o-fail);color:var(--t2o-fail);
  font-family:var(--t2o-mono);text-transform:none;letter-spacing:0}
.tag.stall{border:2px solid var(--t2o-fail);color:var(--t2o-fail);
  font-weight:var(--t2o-fw-semibold)}
.status{display:inline-flex;align-items:center;gap:6px;
  font-family:var(--t2o-mono);font-size:12px;color:var(--t2o-fg-muted);
  white-space:nowrap;max-width:42ch;overflow:hidden;text-overflow:ellipsis}
.status.live{color:var(--t2o-ok)}
.status.stalled,.status.failed{color:var(--t2o-fail)}
.figs{font-family:var(--t2o-mono);font-size:var(--t2o-fs-xs);
  color:var(--t2o-fg-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.say{padding:0 16px 4px 0;font-size:var(--t2o-fs-sm);line-height:1.55;
  color:var(--t2o-fg);max-width:105ch;overflow-wrap:anywhere}
.say .q{color:var(--t2o-fg-faint)}
.ask{padding:0 16px 3px 0;font-size:12px;line-height:1.55;
  color:var(--t2o-fg-soft);max-width:100ch;overflow-wrap:anywhere}
.ask b{color:var(--t2o-fg-muted);font-weight:var(--t2o-fw-regular)}
.spawned{padding:0 16px 3px 0;font-family:var(--t2o-mono);
  font-size:var(--t2o-fs-xs);color:var(--t2o-fg-muted)}
.detail{margin:2px 16px 8px;background:var(--t2o-surface);
  border-left:2px solid var(--t2o-accent);padding:4px 0 4px 10px}
.detail-h{display:flex;align-items:center;gap:8px;margin-bottom:4px;
  font-size:var(--t2o-fs-2xs);font-weight:var(--t2o-fw-semibold);
  letter-spacing:var(--t2o-tracking-label);text-transform:uppercase;
  color:var(--t2o-fg-muted)}
.turn{display:grid;grid-template-columns:5.5rem 1fr;gap:10px;
  padding:2px 0;align-items:baseline}
.turn .when{font-family:var(--t2o-mono);font-size:var(--t2o-fs-xs);
  color:var(--t2o-fg-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.turn .what{font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.turn .what .k{font-family:var(--t2o-mono);font-size:var(--t2o-fs-xs);color:var(--t2o-accent)}
.turn .what .tool{font-family:var(--t2o-mono);font-size:var(--t2o-fs-xs);color:var(--t2o-fg-soft)}
.turn .what .e{font-family:var(--t2o-mono);font-size:var(--t2o-fs-xs);color:var(--t2o-fail)}
.state{display:flex;align-items:flex-start;gap:10px;padding:18px 16px}
.state-b{display:flex;flex-direction:column;gap:5px}
.state-t{font-size:var(--t2o-fs-md);font-weight:var(--t2o-fw-semibold)}
.state-d{font-size:var(--t2o-fs-sm);line-height:1.6;color:var(--t2o-fg-soft);max-width:820px}
.state-m{font-family:var(--t2o-mono);font-size:var(--t2o-fs-xs);color:var(--t2o-fg-muted)}
.loading,.empty{color:var(--t2o-fg-muted);padding:6px 16px;
  font-family:var(--t2o-mono);font-size:var(--t2o-fs-xs)}
.warn{color:var(--t2o-fail)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes arrive{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .pulse{animation:none}
  .row.arrived>.cell{animation:none}
}
</style>

      plugs: "M149.66,138.34a8,8,0,0,0-11.32,0L120,156.69,99.31,136l18.35-18.34a8,8,0,0,0-11.32-11.32L88,124.69,69.66,106.34a8,8,0,0,0-11.32,11.32L64.69,124,41.37,147.31a32,32,0,0,0,0,45.26l5.38,5.37-28.41,28.4a8,8,0,0,0,11.32,11.32l28.4-28.41,5.37,5.38a32,32,0,0,0,45.26,0L132,191.31l6.34,6.35a8,8,0,0,0,11.32-11.32L131.31,168l18.35-18.34A8,8,0,0,0,149.66,138.34Zm-52.29,65a16,16,0,0,1-22.62,0L52.69,181.25a16,16,0,0,1,0-22.62L76,135.31,120.69,180Zm140.29-185a8,8,0,0,0-11.32,0l-28.4,28.41-5.37-5.38a32.05,32.05,0,0,0-45.26,0L124,64.69l-6.34-6.35a8,8,0,0,0-11.32,11.32l80,80a8,8,0,0,0,11.32-11.32L191.31,132l23.32-23.31a32,32,0,0,0,0-45.26l-5.38-5.37,28.41-28.4A8,8,0,0,0,237.66,18.34Zm-34.35,79L180,120.69,135.31,76l23.32-23.31a16,16,0,0,1,22.62,0l22.06,22A16,16,0,0,1,203.31,97.37Z",
      spinner: "M232,128a104,104,0,0,1-208,0c0-41,23.81-78.36,60.66-95.27a8,8,0,0,1,6.68,14.54C60.15,61.59,40,93.27,40,128a88,88,0,0,0,176,0c0-34.73-20.15-66.41-51.34-80.73a8,8,0,0,1,6.68-14.54C208.19,49.64,232,87,232,128Z",
      theme: "M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm8,16.37a86.4,86.4,0,0,1,16,3V212.67a86.4,86.4,0,0,1-16,3Zm32,9.26a87.81,87.81,0,0,1,16,10.54V195.83a87.81,87.81,0,0,1-16,10.54ZM40,128a88.11,88.11,0,0,1,80-87.63V215.63A88.11,88.11,0,0,1,40,128Zm160,50.54V77.46a87.82,87.82,0,0,1,0,101.08Z",
      warn: "M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,172Z"
    };
    var n = svg("0 0 256 256", size || 13, size || 13);
    n.setAttribute("fill", "currentColor");
    n.appendChild(svgPath(paths[name]));
    return n;
  }

  function setHeaderState(kind) {
    dot.replaceChildren();
    if (kind === "up") {
      dot.style.color = "var(--t2o-ok)";
      dot.appendChild(shape("dot", 9));
      connEl.className = "conn up";
      connEl.textContent = "connected";
    } else if (kind === "retry") {
      dot.style.color = "var(--t2o-fail)";
      dot.appendChild(shape("diamond", 9));
      connEl.className = "conn retry";
      connEl.textContent = "reconnecting";
    } else {
      dot.style.color = "var(--t2o-fg-muted)";
      dot.appendChild(shape("ring", 9));
      connEl.className = "conn wait";
      connEl.textContent = "connecting";
    }
  }

  function status(kind, text, title) {
    var cls = kind === "running" ? "status live pulse" : kind === "stalled" ? "status stalled" : kind === "failed" ? "status failed" : "status";
    var n = el("span", cls);
    n.appendChild(shape(kind === "running" ? "dot" : kind === "stalled" ? "square" : kind === "failed" ? "diamond" : "ring", 9));
    n.appendChild(document.createTextNode(text));
    if (title) n.title = title;
    return n;
  }

  function tag(cls, text, iconName, title) {
    var n = el("span", "tag " + cls);
    if (iconName) n.appendChild(icon(iconName, 10));
    n.appendChild(document.createTextNode(text));
    if (title) n.title = title;
    return n;
  }

  function stateBlock(kind, title, body, meta) {
    var n = el("div", "under state");
    var mark = el("span", kind === "lost" ? "status failed" : "status");
    mark.style.marginTop = "1px";
    mark.appendChild(kind === "lost" ? icon("plugs", 16) : kind === "empty" ? icon("info", 16) : icon("spinner", 16));
    n.appendChild(mark);
    var b = el("span", "state-b");
    b.appendChild(el("span", "state-t", title));
    b.appendChild(el("span", "state-d", body));
    if (meta) b.appendChild(el("span", "state-m", meta));
    n.appendChild(b);
    return n;
  }

  function ago(iso) {
    var d = (Date.now() - new Date(iso).getTime()) / 1000;
    if (!isFinite(d)) return "";
    if (d < 60) return Math.max(0, Math.round(d)) + "s";
    if (d < 3600) return Math.round(d / 60) + "m";
    return Math.round(d / 3600) + "h";
  }

  function num(n) {
    n = n || 0;
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return Math.round(n / 1e3) + "k";
    return String(n);
  }

  function clock(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return String(d.getHours()).padStart(2, "0") + ":" +
           String(d.getMinutes()).padStart(2, "0") + ":" +
           String(d.getSeconds()).padStart(2, "0");
  }

  // Box-drawing prefix, so depth is readable at a glance without indentation alone
  // carrying it. `last` tracks, per ancestor level, whether that ancestor was the final
  // child - which is what decides between a continuation bar and a corner.
  function prefix(last) {
    var s = "";
    for (var i = 0; i < last.length - 1; i++) s += last[i] ? "  " : "│ ";
    if (last.length) s += last[last.length - 1] ? "└ " : "├ ";
    return s;
  }

  function renderTurns(box, turns) {
    if (!turns || !turns.length) {
      box.appendChild(el("div", "empty", "no retained turns"));
      return;
    }
    // Newest first: the reason to expand is almost always "what just happened".
    var shown = turns.slice().reverse().slice(0, 40);
    var head = el("div", "detail-h");
    head.appendChild(el("span", null, "Retained turns, newest first"));
    head.appendChild(el("span", "state-m", shown.length + " of 40 shown"));
    box.appendChild(head);
    shown.forEach(function (t) {
      var row = el("div", "turn");
      row.appendChild(el("div", "when", clock(t.last_ts)));
      var what = el("div", "what");

      (t.messages || []).forEach(function (m) {
        var line = el("div");
        line.appendChild(el("span", "k", "say "));
        line.appendChild(document.createTextNode(m.text || "(" + m.chars + " chars)"));
        what.appendChild(line);
      });
      (t.tool_calls || []).forEach(function (c) {
        var line = el("div");
        line.appendChild(el("span", "tool", c.name + " "));
        line.appendChild(document.createTextNode(c.input || "(" + c.input_chars + " chars)"));
        what.appendChild(line);
      });
      if (t.status === "error") {
        var line = el("div");
        line.appendChild(el("span", "e", "error " + (t.error_type || "") + " " + (t.error_code || "")));
        what.appendChild(line);
      }
      if (!what.childNodes.length) {
        what.appendChild(el("span", "k", (t.status || "turn") + " · " + num(t.total_tokens) + " tok"));
      }
      row.appendChild(what);
      box.appendChild(row);
    });
  }

  function loadDetail(id, box) {
    box.replaceChildren(el("div", "loading", "loading…"));
    fetch("/api/threads/" + encodeURIComponent(id) + qs)
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) { detail[id] = d.turns; box.replaceChildren(); renderTurns(box, d.turns); })
      .catch(function (e) { box.replaceChildren(el("div", "empty warn", "could not load turns: " + e)); });
  }

  function renderThread(frag, t, last, content) {
    var isOpen = !!open[t.thread_id];
    var kids = t.children || [];
    var collapsed = !!closed[t.thread_id];
    var isTarget = t.thread_id === targetId;
    var arrived = seenReady && !seen[t.thread_id];
    var row = el("div", "row" + (isOpen ? " open" : "") + (isTarget ? " target" : "") + (arrived ? " arrived" : ""));

    var leadCell = el("div", "cell");
    var lead = el("div", "lead");
    lead.appendChild(el("span", "tree", prefix(last)));
    var caret = el("span", "caret" + (kids.length ? " has" : ""), kids.length ? (collapsed ? "▸" : "▾") : " ");
    if (kids.length) {
      caret.addEventListener("click", function (ev) {
        // Collapsing a subtree and expanding a row's turns are different intents on the
        // same row, so the caret must not also toggle the detail panel.
        ev.stopPropagation();
        if (closed[t.thread_id]) delete closed[t.thread_id]; else closed[t.thread_id] = true;
        render(latest);
      });
    }
    lead.appendChild(caret);

    var nm = el("span", "nm", t.name);
    lead.appendChild(nm);
    // A fork inherits its parent's entire history, so anything it says about its own
    // past is really the parent's. Worth a badge rather than a footnote.
    if (t.is_subagent) lead.appendChild(tag("sub", "sub"));
    if (t.forked_from_thread_id) lead.appendChild(tag("fork", "fork", "fork", "A fork inherits its parent's entire history, so anything it says about its own past is really the parent's."));
    if (t.stalled > 0) lead.appendChild(tag("stall", "stalled"));
    if (t.errors > 0) lead.appendChild(tag("err", t.errors + " err", "warn"));
    leadCell.appendChild(lead);
    row.appendChild(leadCell);

    var stCell = el("div", "cell");
    var st;
    if (!content) {
      st = status("idle", "content withheld");
    } else if (t.stalled > 0) {
      // Quiet for longer than the threshold while still open. Reads identically to a
      // busy agent otherwise, because both sit on "thinking" indefinitely.
      // Say what the badge MEANS rather than just asserting it - the threshold is
      // configurable, so "stalled" is a claim about a setting the reader cannot see.
      st = status("stalled", "no frames for " + quietOf(t.thread_id), "still open, but silent for longer than the " +
        (stallMs ? Math.round(stallMs / 60000) + "m" : "configured") +
        " stall threshold (measured on the archive's clock, not wall clock)");
    } else if (t.running > 0) {
      st = status("running", t.activity || "running");
    } else if (t.errors > 0) {
      st = status("failed", t.errors + " err");
    } else {
      st = status("idle", (t.activity || "idle") + " " + ago(t.last_seen));
    }
    stCell.appendChild(st);
    row.appendChild(stCell);

    var figCell = el("div", "cell");
    figCell.appendChild(el("span", "figs", t.turns + "t " + num(t.total_tokens)));
    row.appendChild(figCell);

    frag.appendChild(row);

    // Line the message up just past the row's own tree glyph, so it reads as belonging
    // to that row rather than floating between two.
    var pad = "calc(.9rem + " + (last.length * 2 + 2) + "ch)";

    if (t.latest_message) {
      var say = el("div", "under say");
      say.style.paddingLeft = pad;
      say.appendChild(el("span", "q", "“"));
      say.appendChild(document.createTextNode(t.latest_message));
      say.appendChild(el("span", "q", "”"));
      frag.appendChild(say);
    }

    // Skip the ask line when the name already IS the ask - true for a root thread,
    // which has no task path to be named by.
    if (t.ask && t.ask !== t.name) {
      var ask = el("div", "under ask");
      ask.style.paddingLeft = pad;
      ask.appendChild(el("b", null, "asked: "));
      ask.appendChild(document.createTextNode(t.ask));
      frag.appendChild(ask);
    }

    if (t.spawned && t.spawned.length) {
      var sp = el("div", "under spawned", "spawned: " + t.spawned.join(", "));
      sp.style.paddingLeft = pad;
      frag.appendChild(sp);
    }

    var box = el("div", "under detail");
    box.style.marginLeft = pad;
    if (isOpen) {
      frag.appendChild(box);
      if (detail[t.thread_id]) renderTurns(box, detail[t.thread_id]);
      else loadDetail(t.thread_id, box);
    }

    row.addEventListener("click", function () {
      if (open[t.thread_id]) {
        delete open[t.thread_id];
        delete detail[t.thread_id];
        if (targetId === t.thread_id) { targetId = null; history.replaceState(null, "", location.pathname + location.search); }
      } else {
        open[t.thread_id] = true;
        targetId = t.thread_id;
        // replaceState, not a hash assignment: setting location.hash pushes a history
        // entry per click, so Back walks the expand history instead of leaving the page.
        history.replaceState(null, "", location.pathname + location.search + "#thread=" + encodeURIComponent(t.thread_id));
      }
      render(latest);
    });

    if (collapsed) {
      if (kids.length) {
        var hid = el("div", "under spawned", "… " + descendants(t) + " hidden");
        hid.style.paddingLeft = pad;
        frag.appendChild(hid);
      }
      return;
    }
    kids.forEach(function (c, i) {
      renderThread(frag, c, last.concat([i === kids.length - 1]), content);
    });
  }

  function render(snap) {
    if (!snap) return;
    latest = snap;
    // A link arriving with #thread= should land with that row already open.
    if (targetId && !open[targetId]) open[targetId] = true;
    if (snap.poll_interval_ms) pollMs = snap.poll_interval_ms;
    if (snap.stall_after_ms) stallMs = snap.stall_after_ms;

    var roots = snap.roots || [];
    if (!seenReady) {
      (function mark(list) {
        list.forEach(function (t) {
          seen[t.thread_id] = true;
          mark(t.children || []);
        });
      })(roots);
      seenReady = true;
    }
    quiet = {};
    (snap.running || []).forEach(function (r) {
      if (r.stalled && (quiet[r.thread_id] == null || r.quiet_ms > quiet[r.thread_id])) {
        quiet[r.thread_id] = r.quiet_ms;
      }
    });
    var running = (snap.running || []).length;
    var total = 0;
    (function count(list) { list.forEach(function (t) { total++; count(t.children || []); }); })(roots);
    var stalled = (snap.running || []).filter(function (r) { return r.stalled; }).length;
    countsEl.textContent = total + (total === 1 ? " thread · " : " threads · ") + running + " running" +
      (stalled ? " · " + stalled + " stalled" : "");
    countsEl.className = stalled ? "meta warn" : "meta";
    lagEl.textContent = pollMs ? "refresh " + Math.round(pollMs / 1000) + "s" : "";

    root.replaceChildren();
    if (!roots.length) {
      root.appendChild(stateBlock("empty", "No activity in the retention window", "The stream is live and the archive is readable. No conversation has been recorded inside the window. Rows appear on their own as traffic arrives, with no reload."));
      return;
    }
    var frag = document.createDocumentFragment();
    if (streamLost) {
      frag.appendChild(stateBlock("lost", "Lost the stream", "The tree below is the last snapshot received and is no longer being updated. EventSource retries on its own, so there is no action to take and no button to press."));
    }
    roots.forEach(function (t, i) {
      renderThread(frag, t, [], snap.content);
    });
    root.appendChild(frag);
    (function mark(list) {
      list.forEach(function (t) {
        seen[t.thread_id] = true;
        mark(t.children || []);
      });
    })(roots);
  }

  var themeBtn = document.getElementById("theme");
  themeBtn.insertBefore(icon("theme", 13), themeBtn.firstChild);
  function effectiveTheme(t) {
    if (t === "light" || t === "dark") return t;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function applyTheme(t) {
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    var label = effectiveTheme(t) === "dark" ? "light" : "dark";
    themeBtn.lastChild.nodeValue = label;
  }
  var stored = null;
  // localStorage throws outright in some privacy modes; a theme toggle is not worth
  // taking the page down for.
  try { stored = localStorage.getItem("codexlb2otel-theme"); } catch (e) { /* ignore */ }
  applyTheme(stored);
  themeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("codexlb2otel-theme", next); } catch (e) { /* ignore */ }
  });

  function connect() {
    var es = new EventSource("/api/stream" + qs);
    es.addEventListener("open", function () {
      streamLost = false;
      setHeaderState("up");
    });
    es.addEventListener("snapshot", function (e) {
      streamLost = false;
      render(JSON.parse(e.data));
    });
    es.addEventListener("error", function () {
      streamLost = true;
      setHeaderState("retry");
      if (latest) render(latest);
      // EventSource retries on its own; closing here would defeat that.
    });
  }

  // poll_interval_ms rides on the REST route only, so fetch once for it then live on
  // the stream.
  fetch("/api/threads" + qs)
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(render)
    .catch(function (e) {
      setHeaderState("retry");
      root.replaceChildren(stateBlock("lost", "Could not load the first snapshot", "The REST route did not return a usable snapshot. The stream will still try to connect.", "error: " + e));
    })
    .finally(connect);
  setHeaderState("wait");
})();
</script>
</body>
</html>
