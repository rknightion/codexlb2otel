# codexlb2otel compose fragment for codex-lb's own stack (issue #10's binding
# decision, 2026-08-07): docker image + compose fragment ADDED to codex-lb's own
# services section, so codexlb2otel starts and stops with codex-lb on camden.
# Explicitly NOT a systemd unit, and NOT a standalone stack of its own.
#
# NOT RUNNABLE ON ITS OWN. This is a `services:` block meant to be merged into
# codex-lb's own compose file on camden (/opt/codex-lb/compose.yml) - paste the
# `codexlb2otel:` service straight into that file's own `services:` section. It
# declares no top-level `volumes:` (the checkpoint is a relative bind, so it
# resolves against whichever compose file it ends up in), no `build:` context
# (ships as a published GHCR image - see .github/workflows/publish.yml), and no
# network of its own:
# merged into codex-lb's compose project it shares that project's default network
# automatically, which this service does not even need - it never talks to
# codex-lb over the network, only reads its archive directory from disk and talks
# out to Grafana Cloud.
#
# DO NOT `docker compose up` THIS FILE AGAINST CAMDEN OR ANY REAL HOST. Per issue
# #10's binding decision, deployment is deliberately the LAST step, not this one -
# this fragment is packaging only.
#
# ARCHIVE MOUNT - RESOLVED against camden 2026-08-07, do not re-litigate:
#   codex-lb mounts it as a BIND, not a named volume. `docker inspect` on the
#   running codex-lb container reports exactly one mount:
#       Type "bind", Source /opt/codex-lb/data/codex-lb,
#       Destination /var/lib/codex-lb, Mode "rw,Z"
#   So the archive is /opt/codex-lb/data/codex-lb/conversation-archive on the HOST
#   (19 archive files present, current), and /var/lib/codex-lb/conversation-archive
#   inside codex-lb's own container. The bind-mount source below is that host path,
#   which is also config.example.yaml's archive.dir default - so the container-side
#   path can stay identical and the shipped config needs no override.
#
#   DO NOT COPY codex-lb's `Z` FLAG ONTO THIS MOUNT. `Z` tells Docker to relabel
#   the content with a label PRIVATE to the mounting container. Applying it here
#   would relabel codex-lb's own data directory out from under it and break the
#   service this one exists to observe. Note this hazard SURVIVED the mount becoming
#   writable (see the volumes section): retention deletes whole files this service
#   has finished with, which is bounded and intended, whereas relabelling breaks
#   codex-lb's access to its own live data. It is moot today because
#   SELinux is Disabled on camden (Fedora 44 Server), which is why codex-lb's own
#   `Z` is inert - but if SELinux is ever enabled, this mount wants a lowercase
#   `z` (shared) or no label flag at all, never `Z`.
#
# CONFIG FILE - RESOLVED against camden 2026-08-07:
#   it sits beside codex-lb's own compose file, which is /opt/codex-lb/compose.yml,
#   so the relative source below resolves to /opt/codex-lb/codexlb2otel.config.yaml.
#   Named codexlb2otel.config.yaml rather than config.yaml because that directory
#   already holds codex-lb's own compose.yml, .env and README - a bare config.yaml
#   there would read as codex-lb's.
#
#   It is a copy of this repo's config.example.yaml, which needs no edits for this
#   host: archive.dir and archive.checkpoint already match the mounts below, and
#   all three tokens are ${...} references satisfied by /opt/codexlb2otel/.env. Never
#   edit config.example.yaml in place to configure a host.
#
#   IT MUST BE READABLE BY uid 1000, and root:root 0640 is not - the sibling files
#   in that directory are root-only and copying their mode is the obvious mistake.
#   Unlike env_file, which the DAEMON reads as root before the container exists, a
#   bind-mounted config file is read by the process itself. Owned root, grouped 1000:
#       sudo install -o root -g 1000 -m 0640 config.example.yaml \
#            /opt/codex-lb/codexlb2otel.config.yaml
#   Get this wrong and the container exits immediately with
#   "config: read ...: permission denied" - loud, at least, unlike the archive
#   permission trap above.
#
# RUNS AS uid 1000, NOT the image's default 65532 - MEASURED, not assumed.
#   The archive directory is `drwx------ rob rob` and every file in it is
#   `-rw------- rob rob` (0600), because codex-lb writes it as its own uid. There is
#   no group or other bit to fall back on, so the ONLY uid that can read it is 1000.
#   Verified directly on camden 2026-08-07 with a throwaway container against the
#   real bind mount: uid 1000 lists 20 files and reads gzip magic (1f8b) off the
#   newest; uid 65532 gets `ls: can't open '/a': Permission denied`. Left at the
#   image default, this service would start cleanly, find nothing, and report an
#   empty archive forever - a silent no-op, not a crash.
#
#   Note the host permissions on the PARENT path (/opt/codex-lb is root-only) do not
#   matter: a bind mount attaches the source directory itself, so only that
#   directory's own mode is consulted inside the container.
#
#   This is still a non-root, no-shell, static distroless container - 1000 rather
#   than 65532 changes which unprivileged uid, nothing else. Do not "fix" this by
#   loosening the archive's permissions: they are codex-lb's, on the only copy of the
#   raw capture, and this service is the one that has to fit around them.
#
# IMAGE TAG - :main on purpose, not a pinned version.
#   camden runs watchtower, so pinning :main is what makes a merge to main reach
#   the host. The shared publish pipeline pushes :main on every push to main and
#   :X.Y.Z/:X.Y/:X/:latest only on a release, so :main is the rolling edge tag and
#   the semver tags exist for anyone who wants to hold still. Deliberately NOT
#   maintained by release-please's x-release-please-version marker - a version
#   pinned here would defeat watchtower and freeze the host at whatever the last
#   release happened to be.

services:
  codexlb2otel:
    image: ghcr.io/rknightion/codexlb2otel:main
    container_name: codexlb2otel
    restart: unless-stopped
    command: ["-config", "/etc/codexlb2otel/config.yaml"]
    # See the "RUNS AS uid 1000" block above. Numeric on purpose: the image has no
    # /etc/passwd worth speaking of, so a name would not resolve.
    user: "1000:1000"
    # Credentials come from this service's OWN .env, following camden's actual
    # convention - verified 2026-08-07, and it is NOT what issue #10 assumed.
    #
    # #10's text says "the lab already resolves both tokens from a single
    # GRAFANA_TOKEN". There is no GRAFANA_TOKEN on camden. Every sibling exporter
    # has its own /opt/<service>/.env holding its own prefixed variables -
    # OPN2OTEL_OTLP_GRAFANA_CLOUD_TOKEN for opnsense2otel,
    # TS2OTEL_OTLP__GRAFANA_CLOUD__TOKEN for tailscale2otel - and codex-lb's own
    # .env carries neither. Following that pattern means codexlb2otel gets
    # /opt/codexlb2otel/.env with CODEXLB2OTEL_-prefixed names, which is exactly
    # what config.example.yaml's ${...} indirections already expect, so the config
    # file needs no change and no second credential gets invented.
    #
    # env_file rather than `environment:` with ${...}: compose's ${...} expansion
    # reads the SHELL that runs `docker compose`, so a variable it cannot see
    # expands to empty and the service starts with an unset token and fails at
    # push time rather than at startup. env_file is read from disk, independent of
    # whoever is invoking compose.
    #
    # The file holds values and is never committed; only its PATH appears here.
    #
    # Left REQUIRED (compose's default) on purpose. `docker compose config` and
    # `up` therefore fail anywhere the file is absent, including on a laptop -
    # that is the correct behaviour and not a defect in this fragment. Marking it
    # `required: false` would let the service start on camden with no credentials
    # at all and fail later at push time, which is the silent-failure shape this
    # repo keeps having to design against.
    env_file:
      - /opt/codexlb2otel/.env
    volumes:
      # Archive: WRITABLE, which REVERSES issue #10's read-only constraint. Rob,
      # 2026-08-07: "it's okay for yesterdays and older to be gone this is a me only
      # tool". The archive stops being the durable record of the raw capture and
      # becomes a buffer, and the `:ro` flag existed only to protect it as the
      # former - see issue #28.
      #
      # What this actually grants is unlink on files in this directory, which is
      # what archive.retain_days needs; read-only made os.Remove return EROFS. The
      # deletion is not blind: never the newest file, and never a file that has not
      # been fully read, so a restart behind a backlog ingests it before dropping
      # it. Both guards are in tail.Watcher.reclaim and are not configurable.
      #
      # Container path mirrors the host path deliberately, so config.example.yaml's
      # own archive.dir default works unedited - one less place for the two to drift
      # apart. The host path is verified - see the ARCHIVE MOUNT block above.
      - /opt/codex-lb/data/codex-lb/conversation-archive:/opt/codex-lb/data/codex-lb/conversation-archive
      # Config file: read-only single-file bind mount, resolved relative to
      # codex-lb's own compose file. See the CONFIG FILE block above.
      - ./codexlb2otel.config.yaml:/etc/codexlb2otel/config.yaml:ro
      # Checkpoint: the ONLY writable mount, and it holds nothing but byte offsets
      # and per-series cumulative counters - no archive content (see
      # internal/turn/state.go: every persisted field is an int or a float, and the
      # map keys are thread ids). Kept at a path of its own so a misconfigured
      # checkpoint can never collide with, or silently fall back to writing into,
      # the read-only archive mount above. Container path matches config.Default's
      # checkpoint default, same reasoning as the archive mount.
      #
      # A BIND, not a named volume, BECAUSE the service runs as uid 1000 (above). A
      # fresh named volume takes its ownership from the image's directory at the
      # mount point, and this image deliberately creates no such directory - so
      # Docker would create it root:root 0755 and the first checkpoint write would
      # fail with EACCES. A host directory can simply be chowned to the uid that has
      # to write it. Create it before first start:
      #     sudo install -d -o 1000 -g 1000 -m 0750 /opt/codex-lb/data/codexlb2otel
      - ./data/codexlb2otel:/var/lib/codexlb2otel
    healthcheck:
      # Redundant with the image's own Dockerfile HEALTHCHECK by default - stated
      # explicitly here anyway so this compose file owns the interval/timing
      # rather than that being something only the image controls, and so
      # `docker compose ps`'s health column keeps working even if a future image
      # ever drops its built-in HEALTHCHECK.
      #
      # The probe is the service binary itself. The image is distroless and has no
      # shell and no HTTP client on purpose, and -healthcheck reads the same
      # config file mounted below - so overriding health.listen there does not
      # leave this probing a stale port and restart-looping the container.
      test: ["CMD", "/codexlb2otel", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Watchtower on camden runs with no --label-enable, so it watches every
    # container by default and needs no opt-in label here - that is what makes
    # :main above roll out on its hourly pass. codex-lb itself carries
    # watchtower.enable=false because it is built locally from ./src and has no
    # registry to pull from; this service is the opposite case, so it stays in.
