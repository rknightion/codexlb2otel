# codexlb2otel compose fragment for codex-lb's own stack (issue #10's binding
# decision, 2026-08-07): docker image + compose fragment ADDED to codex-lb's own
# services section, so codexlb2otel starts and stops with codex-lb on camden.
# Explicitly NOT a systemd unit, and NOT a standalone stack of its own.
#
# NOT RUNNABLE ON ITS OWN. This is a `services:`/`volumes:` block meant to be
# merged into codex-lb's own docker-compose.yml (or docker-compose.prod.yml) on
# camden - either paste the `codexlb2otel:` service and the
# `codexlb2otel-checkpoint` volume directly into that file's own sections, or run
# this file alongside it via
# `docker compose -f docker-compose.yml -f codexlb2otel/docker-compose.yml up`
# from codex-lb's checkout. It declares no `build:` context (ships as a released
# GHCR image - see .github/workflows/docker.yml) and no network of its own:
# merged into codex-lb's compose project it shares that project's default network
# automatically, which this service does not even need - it never talks to
# codex-lb over the network, only reads its archive directory from disk and talks
# out to Grafana Cloud.
#
# DO NOT `docker compose up` THIS FILE AGAINST CAMDEN OR ANY REAL HOST. Per issue
# #10's binding decision, deployment is deliberately the LAST step, not this one -
# this fragment is packaging only.
#
# ARCHIVE MOUNT - RESOLVED against camden 2026-08-07, do not re-litigate:
#   codex-lb mounts it as a BIND, not a named volume. `docker inspect` on the
#   running codex-lb container reports exactly one mount:
#       Type "bind", Source /opt/codex-lb/data/codex-lb,
#       Destination /var/lib/codex-lb, Mode "rw,Z"
#   So the archive is /opt/codex-lb/data/codex-lb/conversation-archive on the HOST
#   (19 archive files present, current), and /var/lib/codex-lb/conversation-archive
#   inside codex-lb's own container. The bind-mount source below is that host path,
#   which is also config.example.yaml's archive.dir default - so the container-side
#   path can stay identical and the shipped config needs no override.
#
#   DO NOT COPY codex-lb's `Z` FLAG ONTO THIS MOUNT. `Z` tells Docker to relabel
#   the content with a label PRIVATE to the mounting container. Applying it here
#   would relabel codex-lb's own data directory out from under it and break the
#   service this one exists to observe - the exact "must never be able to damage
#   the only copy of the raw capture" failure the read-only mount guards against,
#   arriving through a flag rather than through a write. It is moot today because
#   SELinux is Disabled on camden (Fedora 44 Server), which is why codex-lb's own
#   `Z` is inert - but if SELinux is ever enabled, this mount wants a lowercase
#   `z` (shared) or no label flag at all, never `Z`.
#
# UNRESOLVED - NEEDS A HUMAN before this can be deployed for real:
#   1. CONFIG FILE PATH: the bind mount source below
#      (./codexlb2otel/config.yaml) assumes a sibling directory next to wherever
#      codex-lb's own compose file lives. Confirm/adjust to wherever the real
#      config actually lives on camden - copy config.example.yaml there and edit
#      it, never edit config.example.yaml itself in place.
#   2. IMAGE TAG: the version below is maintained by release-please
#      (x-release-please-version, see release-please-config.json's extra-files) -
#      it will read 0.0.0 until the first real release exists. Do not deploy
#      against 0.0.0; wait for a real vX.Y.Z release, per the binding decision.

services:
  codexlb2otel:
    # Version kept in sync with the released image tag by release-please - do not
    # bump by hand, and do not deploy before a real release exists (see item 2
    # above).
    image: ghcr.io/rknightion/codexlb2otel:0.0.0 # x-release-please-version
    container_name: codexlb2otel
    restart: unless-stopped
    command: ["-config", "/etc/codexlb2otel/config.yaml"]
    # Credentials come from this service's OWN .env, following camden's actual
    # convention - verified 2026-08-07, and it is NOT what issue #10 assumed.
    #
    # #10's text says "the lab already resolves both tokens from a single
    # GRAFANA_TOKEN". There is no GRAFANA_TOKEN on camden. Every sibling exporter
    # has its own /opt/<service>/.env holding its own prefixed variables -
    # OPN2OTEL_OTLP_GRAFANA_CLOUD_TOKEN for opnsense2otel,
    # TS2OTEL_OTLP__GRAFANA_CLOUD__TOKEN for tailscale2otel - and codex-lb's own
    # .env carries neither. Following that pattern means codexlb2otel gets
    # /opt/codexlb2otel/.env with CODEXLB2OTEL_-prefixed names, which is exactly
    # what config.example.yaml's ${...} indirections already expect, so the config
    # file needs no change and no second credential gets invented.
    #
    # env_file rather than `environment:` with ${...}: compose's ${...} expansion
    # reads the SHELL that runs `docker compose`, so a variable it cannot see
    # expands to empty and the service starts with an unset token and fails at
    # push time rather than at startup. env_file is read from disk, independent of
    # whoever is invoking compose.
    #
    # The file holds values and is never committed; only its PATH appears here.
    #
    # Left REQUIRED (compose's default) on purpose. `docker compose config` and
    # `up` therefore fail anywhere the file is absent, including on a laptop -
    # that is the correct behaviour and not a defect in this fragment. Marking it
    # `required: false` would let the service start on camden with no credentials
    # at all and fail later at push time, which is the silent-failure shape this
    # repo keeps having to design against.
    env_file:
      - /opt/codexlb2otel/.env
    volumes:
      # Archive: READ-ONLY - the hard constraint from issue #10. This directory is
      # the only copy of the raw capture; codexlb2otel must never be able to
      # write to, move, or delete anything under it (contrast the checkpoint
      # volume below, the one thing this service IS allowed to write). Container
      # path mirrors the host path deliberately, so config.example.yaml's own
      # archive.dir default works unedited - one less place for the two to drift
      # apart. The host path is verified - see the ARCHIVE MOUNT block above.
      - /opt/codex-lb/data/codex-lb/conversation-archive:/opt/codex-lb/data/codex-lb/conversation-archive:ro
      # Config file: read-only single-file bind mount. config.example.yaml is the
      # documented starting point - copy it to the path below and edit before
      # first run. See UNRESOLVED item 1 above.
      - ./codexlb2otel/config.yaml:/etc/codexlb2otel/config.yaml:ro
      # Checkpoint: the ONLY writable mount, and it holds nothing but byte offsets
      # and reducer state - never archive content. A separate named volume so a
      # misconfigured checkpoint path can never collide with, or silently fall
      # back to writing into, the read-only archive mount above. Path matches
      # config.Default's own checkpoint default, same reasoning as the archive
      # mount.
      - codexlb2otel-checkpoint:/var/lib/codexlb2otel
    healthcheck:
      # Redundant with the image's own Dockerfile HEALTHCHECK by default - stated
      # explicitly here anyway so this compose file owns the interval/timing
      # rather than that being something only the image controls, and so
      # `docker compose ps`'s health column keeps working even if a future image
      # ever drops its built-in HEALTHCHECK.
      #
      # The probe is the service binary itself. The image is distroless and has no
      # shell and no HTTP client on purpose, and -healthcheck reads the same
      # config file mounted below - so overriding health.listen there does not
      # leave this probing a stale port and restart-looping the container.
      test: ["CMD", "/codexlb2otel", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  codexlb2otel-checkpoint:
    name: codexlb2otel-checkpoint
