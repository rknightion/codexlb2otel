# codexlb2otel example configuration.
#
# Every key below has a default (see internal/config/config.go's Default()); a real
# deployment only needs to set what differs from it, because Load overlays this file
# on top of Default() rather than replacing it - an absent key keeps its default
# rather than becoming a zero value.
#
# Secrets (loki.token, otlp.token, agento11y.token) NEVER go inline here. Two forms
# are supported:
#   ${ENV_VAR_NAME}   read from an environment variable at startup
#   file:/some/path   read from a file's contents (trailing whitespace trimmed)
# An unset ${ENV_VAR_NAME} or an unreadable file: is a startup error, not a silent
# empty credential - see config.Secret.Resolve.

service:
  # name is the service_name Loki stream label and the OTel service.name resource
  # attribute. Required.
  name: codexlb2otel
  # environment is an optional resource attribute distinguishing deployments, e.g.
  # "lab" vs "prod". Leave empty if there is only one.
  environment: lab

archive:
  # dir is the conversation-archive directory codex-lb writes into.
  dir: /opt/codex-lb/data/codex-lb/conversation-archive
  # checkpoint is where byte offsets and reducer state are persisted so a restart
  # resumes exactly rather than re-shipping the whole archive. Must be on a volume
  # that survives container/host restarts.
  checkpoint: /var/lib/codexlb2otel/checkpoint.json
  # poll_interval is how often the directory is rescanned for new data.
  poll_interval: 5s
  # chunk_bytes bounds how much compressed data is read into memory per pass. Archive
  # files reach several hundred MB, so this must stay well below available memory.
  chunk_bytes: 16777216 # 16MiB
  # retain_days keeps that many UTC calendar days of archive, counting today, and
  # deletes fully-ingested files from before that. 1 = today only, so yesterday and
  # older go. Zero disables it.
  #
  # The day comes from the FILENAME, which codex-lb writes as
  # datetime.now(UTC).strftime('%Y-%m-%dT%H') - so this is a UTC calendar boundary,
  # not a local one, and not a rolling 24 hours either. At 09:00 "delete yesterday"
  # and "delete anything over 24h old" are different answers; this is the first.
  #
  # THE ARCHIVE MOUNT MUST BE WRITABLE for this to do anything. Read-only, os.Remove
  # returns EROFS and you get one error log per poll and no reclaimed bytes.
  #
  # Two guards apply regardless and are not configurable: a file is never deleted
  # until it has been fully read (so a restart behind a backlog ingests the backlog
  # before dropping any of it), and the newest file is never deleted at all (codex-lb
  # is still appending to it).
  retain_days: 1
  # delete_after is the rolling-duration alternative, for keeping a fixed margin
  # rather than a calendar day. Same two guards, same writable-mount requirement.
  # ZERO MEANS NEVER. Either rule firing is enough to reclaim a file, so leaving this
  # at zero alongside retain_days above is the normal case, not a contradiction.
  delete_after: 0s

loki:
  # enabled turns on the native Loki log push. This is the ONLY log transport this
  # service has - there is deliberately no OTLP logs option, because label and
  # structured-metadata control (which OTLP's log model does not have an equivalent
  # of) is the entire reason this path was chosen over OTLP for logs.
  enabled: true
  # url is the full push endpoint, including /loki/api/v1/push.
  url: https://logs-prod-035.grafana.net/loki/api/v1/push
  # user is the Grafana Cloud Loki user id, sent as the basic-auth username.
  user: "1175378"
  # token is the access-policy token with logs:write, resolved from the environment
  # so it never appears in this file or in version control.
  token: "${CODEXLB2OTEL_LOKI_TOKEN}"
  # labels are the Loki stream keys. Validated against internal/attr's bounded
  # allowlist at startup: only fields with a small, known set of values may become a
  # label, because each distinct value opens a new stream. Everything else about a
  # record is still queryable, as structured metadata rather than a label. Leave
  # unset for the minimal default set (service_name, family, record_type).
  # labels: [service_name, family, record_type]
  # max_line_bytes is the per-line budget, kept under Loki's max_line_size (256KiB).
  # Loki DISCARDS an oversized line entirely rather than truncating it, so this must
  # bite first, on this side, where the overflow is at least visible.
  max_line_bytes: 196608 # 192KiB
  # batch_size and batch_wait bound how much is buffered before a push.
  batch_size: 1000
  batch_wait: 2s
  # timeout bounds a single push attempt.
  timeout: 30s
  # max_retries bounds retries of a RETRYABLE failure. A permanent 4xx is counted and
  # dropped rather than retried forever, which would wedge the checkpoint behind it.
  max_retries: 5
  # record_types selects which line kinds are emitted. Empty means all of them.
  # record_types: []

otlp:
  # endpoint is the OTLP gateway base URL. Serves both metrics and traces.
  endpoint: https://otlp-gateway-prod-gb-south-1.grafana.net/otlp
  # instance_id is the Grafana Cloud instance id, sent as the basic-auth username.
  instance_id: "1217581"
  # token is the access-policy token, resolved from the environment.
  token: "${CODEXLB2OTEL_OTLP_TOKEN}"
  metrics:
    enabled: true
    # interval is the metric export period.
    interval: 30s
  traces:
    enabled: true
    # sample_ratio is the head-sampling ratio in [0,1]. 1 means every trace.
    sample_ratio: 1
  # timeout bounds a single export, for either signal.
  timeout: 30s

agento11y:
  # enabled turns on the Grafana agent-observability (sigil) generation sink. This is
  # ADDITIVE to otlp.traces above, not an alternative to it: the OTLP trace export to
  # Tempo keeps running unchanged, and this pushes the same turns a second time in
  # sigil's own ExportGenerations wire format. Sigil's product surface -
  # conversations, generations, the agent catalog - is populated ONLY by this
  # endpoint (or by sigil's own tolerant OTLP-span decoder), so spans that reach
  # Tempo land nowhere in sigil's database. See issue #19.
  #
  # OFF because the CREDENTIAL is not ready, not because the sink is unfinished.
  # ExportGenerations needs the `sigil:write` scope on the access policy, and the
  # token in use carries only logs/metrics/traces. Enabled against it, the endpoint
  # answers 401 "authentication error: invalid scope requested" - which this sink
  # correctly classifies as a config fault, so it never retries and it HOLDS THE
  # CHECKPOINT. One missing scope therefore stops every other signal too, which is
  # why this ships off rather than left to fail loudly. Observed on the first
  # production run, 2026-08-07.
  #
  # To turn on: add `sigil:write` to the access policy - in the Cloud UI `sigil` is
  # not in the default resource list, add it via "Add scope" then tick Write (the
  # Cloud resource keeps the old name) - or mint a token from the stack's
  # grafana-agento11y-app plugin Connection tab. Then flip this to true.
  enabled: false
  # url is the full ExportGenerations endpoint, not just a host. Region must match
  # the stack's - gb-south-1 for instance 1217581, same as the OTLP gateway above.
  url: https://agento11y-prod-gb-south-1.grafana.net/api/v1/generations:export
  # user is the Grafana Cloud instance id, sent as the basic-auth username - the same
  # instance that serves OTLP above.
  user: "1217581"
  # token is the access-policy token, resolved from the environment.
  token: "${CODEXLB2OTEL_AGENTO11Y_TOKEN}"
  # batch_size is deliberately far below loki.batch_size: a generation carries full
  # message content rather than a metadata line, so a failed push re-sends much more.
  batch_size: 200
  batch_wait: 5s
  # timeout bounds one export call.
  timeout: 30s
  # max_retries bounds retries of a RETRYABLE failure (429/5xx/transport). A permanent
  # 4xx that indicts the request itself is counted and dropped, never retried.
  #
  # Note that a 2xx here is NOT proof of delivery: ExportGenerations can accept the
  # request and still refuse individual generations inside it, reporting that per
  # generation in the response body. The sink always parses that body and counts the
  # refusals - see codexlb.selfobs.* / the sink rejection metrics rather than the
  # absence of errors in the log.
  max_retries: 5

health:
  # enabled turns on the readiness + config-dump HTTP endpoint. The config dump is
  # safe to expose as-is: config.Secret masks itself in every serialisation path, so
  # loki.token/otlp.token never appear in it regardless of this setting.
  enabled: true
  # listen is loopback-only by default - nothing about this endpoint (which reports
  # endpoint URLs and internal state) is meant to be reachable off the box.
  listen: "127.0.0.1:9464"

live:
  # enabled turns on the in-process web view of recent conversation activity: parent
  # threads, the subagents they spawned, and what each is doing - completed turns and
  # responses still running.
  #
  # It is a WINDOW, not a destination. Nothing is persisted; a restart empties it.
  enabled: false
  # listen is its OWN port, deliberately not shared with health. /healthz serves the
  # whole config dump, and exposing this view must not drag that along with it.
  listen: "127.0.0.1:9465"
  # token, when set, is required on every request as `Authorization: Bearer <token>`
  # or as a `token` query parameter. The query form exists because a browser's
  # EventSource cannot set headers. Supports ${ENV} and file: like every other secret.
  token: ""
  # retain_turns bounds the in-memory ring. It is a MEMORY backstop, not the retention
  # policy - retain_window below is. Set high enough not to bind first: at 500 it was
  # what actually evicted, since a real fan-out on camden produced 238 turns in 19
  # minutes (so ~41 minutes of history, and far less with more lanes running).
  retain_turns: 20000
  # retain_window hides threads that have been idle longer than this.
  #
  # ADAPTIVE, not a plain age cutoff. Two things are never evicted for being old: a
  # thread with a response still OPEN (its newest completed turn goes stale precisely
  # because it is hanging, so a plain cutoff removes the wedged agent first), and any
  # ancestor of a thread that is kept (eviction is per thread but the view is a tree,
  # and dropping a parent re-roots its children rather than removing them).
  retain_window: 30m
  # stall_after flags an open response that has produced no frames for this long - the
  # wedged case, which otherwise reads identically to a busy one because both sit on
  # "thinking" forever.
  #
  # Measured on the ARCHIVE's clock, never wall clock: when ingestion falls behind,
  # wall clock would mark every response stalled at once. The trade is that if
  # EVERYTHING goes quiet nothing is flagged - that is an ingestion outage, and
  # /healthz answers for it. Zero disables the check.
  stall_after: 5m
  # content serves message bodies. This page shows prompts, assistant messages and
  # whole command output - the README's content warning applies to a browser exactly
  # as it applies to Loki. Set false for a structural view: models, tool names,
  # subagent kinds, timings and token counts, with no prose anywhere.
  content: true
  # include_probe keeps this service's own synthetic health traffic in the view. Off
  # by default; it would otherwise dominate a quiet period.
  include_probe: false
  # allow_insecure permits a non-loopback listen with no token. Without it, that
  # combination is a STARTUP ERROR rather than a warning - an unauthenticated
  # transcript feed is not something to discover from a log line later.
  allow_insecure: false

# summarize configures clbsum, which asks a language model what work a session
# accomplished. Nothing in the daemon reads this - it is the oneshot tool's config.
#
# THIS IS THE ONLY PART OF THIS PROJECT THAT SENDS CAPTURED CONTENT TO A THIRD PARTY.
# Loki and the OTLP gateway are endpoints you chose and control. OpenRouter routes to
# whichever provider serves the model, so real prompts, real assistant messages and real
# command output leave your infrastructure - including, per the README's content warning,
# whatever secret an agent happened to cat. That is why enabled defaults to false and why
# the two routing preferences below are set restrictively rather than left to
# OpenRouter's own defaults.
#
# `clbsum -list` and `clbsum -dry-run` work with this disabled and no key at all, and
# show exactly which sessions and how much text would be sent.
summarize:
  enabled: false
  # api_key is the OpenRouter credential. Supports ${ENV} and file: like every other
  # secret here, and is masked everywhere a config is printed.
  api_key: "${OPENROUTER_API_KEY}"
  # model is an OpenRouter model slug. The default has a 1,048,576-token context, which
  # is what keeps a whole session in ONE call rather than chunking it into several -
  # chunking costs more, takes longer and produces a vaguer narrative.
  model: "deepseek/deepseek-v4-flash"
  # base_url overrides the OpenRouter endpoint, for a proxy. Empty uses the default.
  base_url: ""
  # max_chars_per_session bounds one thread's digest. Over it, the digest is split at
  # TURN boundaries and summarised in several passes, then those summaries are
  # summarised. ~375k tokens, comfortably inside the default model's context.
  max_chars_per_session: 1500000
  # max_chars_per_tool_input bounds ONE tool call's arguments. Generous on purpose: the
  # file paths, shell commands and patch bodies are what say something actually changed,
  # which is the entire question being asked.
  max_chars_per_tool_input: 20000
  # max_chars_per_tool_output bounds one tool RESULT, kept as a head AND a tail. Tight,
  # because tool output is mostly console noise - but head-only would be worse than
  # tight: a command's verdict is usually its last line, so head-only truncation
  # reliably cuts exactly the part that mattered.
  max_chars_per_tool_output: 2000
  # concurrency bounds in-flight model calls.
  concurrency: 4
  # max_retries bounds the exponential backoff on 429 and 5xx. Other failures are not
  # retried - a rejected key will still be rejected the fifth time.
  max_retries: 5
  # timeout bounds one model call. A whole session in one 375k-character call is a slow
  # request, so this is minutes rather than seconds.
  timeout: 5m
  # zdr restricts routing to zero-data-retention endpoints, and data_collection is
  # allow | deny - deny uses only providers that do not store user data. Both are sent
  # on EVERY request, so the guarantee travels with the request instead of depending on
  # an account setting invisible from here. OpenRouter's own default for data_collection
  # is "allow"; this is deliberately not that.
  zdr: true
  data_collection: deny

log:
  # level is debug | info | warn | error.
  level: info
  # format is text | json. Use json when logs are collected by something that parses
  # structured fields rather than a human reading a terminal.
  format: text
