apiVersion: 1
groups:
- orgId: 1
  name: codexlb2otel-sink-health
  folder: codexlb2otel
  interval: 1m
  rules:
  - uid: codexlb-loki-rejections-nonzero
    title: 'codexlb2otel: Loki rejections non-zero'
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: grafanacloud-prom
      model:
        editorMode: code
        expr: sum(increase(codexlb_selfobs_sink_rejections_total{service_name="codexlb2otel", codexlb_selfobs_sink="loki"}[15m]))
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: classic_conditions
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: warning
      service: codexlb2otel
    annotations:
      summary: codexlb2otel is dropping Loki lines
      description: 'codexlb.selfobs.sink_rejections (internal/attr/names.go''s MetricSelfSinkRejections,
        wired in internal/sink/otlpmetric/selfobs.go), filtered to codexlb_selfobs_sink="loki" - one of
        the fixed sink names (loki|otlpmetric|otlptrace|agento11y, each Sink''s own Name()). Issue #8
        landed in this repo''s working tree (uncommitted, a concurrent lane) partway through this task;
        an earlier draft of this rule used a placeholder name this lane invented, before the real metric
        existed - corrected once it landed. It reuses internal/sink/loki.Sink.Rejections()''s own sink.Reason*
        values directly rather than duplicating them (selfobs.go''s explicit design choice), and is exactly
        the number cmd/codexlb2otel/main.go''s reportRejections previously only logged at WARN with no
        metric behind it.'
