apiVersion: 1
groups:
- orgId: 1
  name: codexlb2otel-ingest-lag
  folder: codexlb2otel
  interval: 1m
  rules:
  - uid: codexlb-ingest-lag-seconds
    title: 'codexlb2otel: ingest lag above threshold'
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: grafanacloud-prom
      model:
        editorMode: code
        expr: codexlb_selfobs_ingest_lag_seconds{service_name="codexlb2otel"}
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: classic_conditions
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 300
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: critical
      service: codexlb2otel
    annotations:
      summary: codexlb2otel ingest lag exceeds 5 minutes
      description: 'codexlb.selfobs.ingest_lag_seconds (internal/attr/names.go''s MetricSelfIngestLag,
        wired in internal/sink/otlpmetric/selfobs.go) - issue #8 landed in this repo''s working tree (uncommitted,
        a concurrent lane) partway through this task; an earlier draft of this rule used issue #8''s own
        prose name ("ingest_lag_seconds", unprefixed) as a forward reference before the real, namespaced
        name existed in code - corrected once it landed, per this task''s own instruction to trust code
        over issue text. "The alert that catches everything else" (issue #8): a stalled watcher, a stuck
        checkpoint, a sink rejecting everything all look like lag growing before they look like anything
        else. Threshold (300s/5m) is a starting point, not measured against real traffic - tune once live.'
