apiVersion: 1
groups:
- orgId: 1
  name: codexlb2otel-rate-limits
  folder: codexlb2otel
  interval: 1m
  rules:
  - uid: codexlb-rate-limit-headroom-exhausted
    title: 'codexlb2otel: rate-limit headroom exhausted on an account'
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: grafanacloud-prom
      model:
        editorMode: code
        expr: codexlb_rate_limit_used_percent{service_name="codexlb2otel"}
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: classic_conditions
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: warning
      service: codexlb2otel
    annotations:
      summary: Account {{ $labels.codexlb_account_id }} rate-limit headroom above 90%
      description: 'codexlb.rate_limit.used_percent, per codexlb_account_id - Grafana evaluates one alert
        instance per returned series, so this fires per-account by construction rather than averaging
        across accounts (the whole point of a load-balancer view, per issue #14''s own acceptance criteria).
        90% is a starting threshold; tune against real headroom curves.'
