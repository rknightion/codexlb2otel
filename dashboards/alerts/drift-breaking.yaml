apiVersion: 1
groups:
- orgId: 1
  name: codexlb2otel-drift
  folder: codexlb2otel
  interval: 1m
  rules:
  - uid: codexlb-drift-breaking
    title: 'codexlb2otel: breaking archive drift finding'
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: grafanacloud-prom
      model:
        editorMode: code
        expr: sum(codexlb_archive_drift_findings{service_name="codexlb2otel", severity="breaking"})
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: classic_conditions
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: Error
    for: 0m
    labels:
      severity: critical
      service: codexlb2otel
    annotations:
      summary: codex-lb archive format drift detected (breaking)
      description: 'NOT YET IMPLEMENTED (issue #13, still absent as of this dashboard''s authoring) -
        this metric does not exist in the deployed service today. See dashboards/07-pipeline-health.json
        and dashboards/README.md. Metric name is issue #13''s own text verbatim, already in final Prometheus
        form: codexlb_archive_drift_findings{severity="breaking|new|info"}. Per issue #13: a breaking
        finding should page (this rule); new should notify (not built here - lower urgency, add a second
        rule at severity=info/notify once the metric exists); absence findings (info) must never page,
        so they are deliberately excluded from this condition.'
