apiVersion: 1
groups:
- orgId: 1
  name: codexlb2otel-drift
  folder: codexlb2otel
  interval: 1m
  rules:
  - uid: codexlb-drift-breaking
    title: 'codexlb2otel: breaking archive drift finding'
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: grafanacloud-prom
      model:
        editorMode: code
        expr: sum(codexlb_archive_drift_findings{service_name="codexlb2otel", codexlb_selfobs_severity="breaking"})
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: classic_conditions
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: Error
    for: 0m
    labels:
      severity: critical
      service: codexlb2otel
    annotations:
      summary: codex-lb archive format drift detected (breaking)
      description: 'codexlb2otel runs the archive drift probe in-process against the live archive.
        This rule pages only on codexlb.archive_drift_findings with codexlb.selfobs.severity=breaking,
        exposed in Prometheus as codexlb_archive_drift_findings{codexlb_selfobs_severity="breaking"}.
        New findings should notify elsewhere; absence findings are informational by design and must
        never page.'
